name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest --cov=agentops --cov-report=term-missing

      - name: Offline demo
        run: python scripts/demo.py --offline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t multi-agent-ops:ci .
      - name: Boot it and check the probes
        run: |
          docker run -d --name api -p 8000:8000 multi-agent-ops:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/readyz | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS http://localhost:8000/v1/agents | grep -q code_reviewer
          docker rm -f api
