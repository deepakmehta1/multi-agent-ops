name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress, so results are never stale and
# minutes are not wasted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let every Python version finish, so a failure on one does not hide the others.
      fail-fast: false
      matrix:
        # The supported range: pyproject.toml requires Python 3.11 or newer.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # There is no lockfile, so the dependency spec is pyproject.toml; key the pip cache on it.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Type-check
        run: mypy

      - name: Check the console script parses
        run: node --check src/agentops/ui/app.js

      - name: Test
        run: pytest --cov=agentops --cov-report=term-missing

      # Runs a real orchestration against the scripted model, which catches a broken control flow
      # that isolated unit tests could miss.
      - name: Offline demo
        run: python scripts/demo.py --offline

  # Builds and boots the image. Unit tests cannot cover this: the Dockerfile itself, the data files
  # that must ship inside the package, and the health and readiness probes.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t multi-agent-ops:ci .
      - name: Boot it and check the probes
        run: |
          docker run -d --name api -p 8000:8000 multi-agent-ops:ci
          # Wait up to 30 seconds for the server to come up.
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/readyz | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS http://localhost:8000/v1/agents | grep -q code_reviewer
          docker rm -f api
